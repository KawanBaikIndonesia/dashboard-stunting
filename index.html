<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">

<body>
<title>Pusat Pantau Stunting Sumba Timur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Pusat komando: bilah judul di atas, peta besar di tengah, dua kolom panel di sisi, pita temuan berjalan di bawah. Satu tema gelap yang dipilih sengaja untuk layar ruangan. */
:root{
  color-scheme:dark;
  --bg:#050d19; --pn:rgba(10,30,52,.78); --pn2:rgba(18,46,76,.7); --edge:rgba(70,170,230,.34); --edge2:rgba(70,170,230,.16);
  --fg:#e7f3fc; --muted:#8fb1c9; --cy:#3fd2ff; --cy2:#1d7fb8; --sea:#09192d;
  --good:#35c46a; --warn:#f2b72a; --crit:#f0504a; --none:#3e586c;
  --tg:#6fe39a; --tw:#ffd266; --tc:#ff8f89;
  --disp:"Chakra Petch","Public Sans",system-ui,sans-serif; --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% 0%,#0b2748 0%,transparent 70%),var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
h1,h2,h3,p{margin:0}
.cc{display:flex;flex-direction:column;gap:12px;max-width:1920px;margin-inline:auto;min-height:100%}
@media (min-width:1100px) and (min-height:640px){.cc{height:100%}}

/* bilah atas */
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px 16px;align-items:center}
.top .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.clock{font-family:var(--mono);font-size:1.25rem;color:var(--cy);letter-spacing:.04em}
.date{font-size:.8rem;color:var(--muted)}
.banner{position:relative;text-align:center;padding:8px 44px;min-width:0}
.banner::before,.banner::after{content:"";position:absolute;top:50%;width:34px;height:2px;background:linear-gradient(90deg,transparent,var(--cy))}
.banner::before{left:0}.banner::after{right:0;transform:scaleX(-1)}
.banner h1{font-family:var(--disp);font-weight:700;font-size:clamp(1.15rem,2.1vw,1.9rem);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 18px rgba(63,210,255,.55);text-wrap:balance}
.banner .sb{font-size:.72rem;letter-spacing:.18em;color:var(--cy);text-transform:uppercase;font-family:var(--mono)}
.top .r{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.seg{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--edge);border-radius:6px;background:rgba(6,20,36,.7)}
.seg button{border:0;background:transparent;min-height:44px;min-width:60px;padding:0 14px;border-radius:4px;font-weight:600;color:var(--muted);font-family:var(--disp);letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--cy);color:#04243a;box-shadow:0 0 14px rgba(63,210,255,.5)}
.ib{min-height:44px;min-width:44px;border:1px solid var(--edge);border-radius:6px;background:rgba(6,20,36,.7);font-weight:700;font-family:var(--disp);padding:0 12px}
@media (max-width:900px){.top{grid-template-columns:1fr}.top .r{justify-content:flex-start}.banner{order:-1;text-align:left;padding:0}.banner::before,.banner::after{display:none}}

/* badan */
.body{display:grid;grid-template-columns:minmax(270px,.78fr) minmax(0,2fr) minmax(290px,.92fr);gap:12px;min-height:0;flex:1}
@media (max-width:1099px){.body{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.pn{position:relative;background:var(--pn);border:1px solid var(--edge);border-radius:4px;display:flex;flex-direction:column;min-height:0;min-width:0;backdrop-filter:blur(3px)}
.pn::before,.pn::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
.pn::before{top:-1px;left:-1px;border-top:2px solid var(--cy);border-left:2px solid var(--cy)}
.pn::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--cy);border-right:2px solid var(--cy)}
.pn>header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:linear-gradient(90deg,rgba(63,210,255,.22),transparent);border-bottom:1px solid var(--edge2);font-family:var(--disp);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:.82rem}
.pn>header i{width:8px;height:8px;background:var(--cy);transform:rotate(45deg);box-shadow:0 0 8px var(--cy);flex:none}
.pn>header .sub{margin-left:auto;font-family:var(--sans);text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);font-size:.75rem}
.bd{padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--cy2) transparent}
@media (min-width:1100px) and (min-height:640px){.col>.pn{flex:1 1 0}.col>.pn.xl{flex:1.5 1 0}}
.mapcol{display:flex;flex-direction:column;min-height:0;min-width:0}
.mapcol .pn{flex:1}
.crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--edge2);min-height:52px}
.crumb button{min-height:40px;border:1px solid var(--edge);background:rgba(63,210,255,.1);border-radius:4px;padding:0 12px;font-weight:600}
.crumb .here{font-family:var(--disp);font-weight:700;letter-spacing:.04em}
.crumb .sep{color:var(--muted)}
.crumb .hint{margin-left:auto;color:var(--muted);font-size:.8rem}
.mapbox{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at 50% 42%,#0f2f52 0%,#09203b 55%,#06142a 100%)}
.mapbox::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(63,210,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(63,210,255,.07) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
@media (max-width:1099px){.mapbox{aspect-ratio:1020/934;flex:none}}
svg.map{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;user-select:none}
.kg{cursor:pointer}
.kg:focus-visible{outline:none}
.kg:focus-visible .p2{stroke:var(--cy);stroke-width:3}
.lab{font-family:var(--disp);font-weight:600;fill:#fff;paint-order:stroke;stroke:#04101e;stroke-linejoin:round;pointer-events:none}
.layer{position:absolute;left:12px;top:12px;z-index:3}
.legend{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;flex-direction:column;gap:5px;padding:9px 12px;background:rgba(5,16,30,.82);border:1px solid var(--edge);border-radius:4px;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:16px;height:16px;border-radius:3px;border:1px solid rgba(255,255,255,.25);display:inline-block;flex:none}
.tip{position:absolute;z-index:6;pointer-events:none;background:rgba(5,16,30,.95);border:1px solid var(--cy);border-radius:4px;padding:8px 10px;font-size:.82rem;max-width:240px;box-shadow:0 0 18px rgba(63,210,255,.3)}
.tip b{display:block;font-family:var(--disp)}
.hide{display:none!important}

/* isi panel */
.lead{display:flex;flex-direction:column;gap:9px}
.lead p{font-size:.98rem;line-height:1.5}
.lead b{color:var(--cy);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;padding:1px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.t-good{color:var(--tg)}.t-warn{color:var(--tw)}.t-crit{color:var(--tc)}.t-none{color:var(--muted)}
.sm{font-size:.78rem;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border:1px solid var(--edge2);background:rgba(63,210,255,.07);border-radius:4px;width:100%;text-align:left}
.row:hover{border-color:var(--cy)}
.row .nm{flex:1;min-width:0;font-weight:600}
.row .ct{font-family:var(--mono);font-size:1.1rem;min-width:2ch;text-align:right}
.row .mb{width:60px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;flex:none}
.row .mb i{display:block;height:100%;background:var(--cy)}
.rk{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:2px 8px;align-items:center;width:100%;text-align:left;border:1px solid transparent;border-radius:4px;background:transparent;padding:5px 8px;min-height:44px}
.rk:hover,.rk[aria-pressed="true"]{background:rgba(63,210,255,.09);border-color:var(--edge2)}
.rk .nm{font-size:.86rem;overflow-wrap:anywhere}
.rk .pc{font-family:var(--mono);text-align:right;font-size:.86rem}
.rk .bar{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.rk .bar i{display:block;height:100%}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:rgba(63,210,255,.07);border:1px solid var(--edge2);border-radius:4px;padding:6px 9px;min-width:0}
.stat .v{font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat .l{font-size:.72rem;color:var(--muted);line-height:1.25}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.zb{display:flex;height:18px;border-radius:3px;overflow:hidden;gap:2px}
.zb i{display:block;height:100%}
.zl{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:.82rem}
.zl span{display:flex;align-items:center;gap:7px}
.zl b{font-family:var(--mono);margin-left:auto}
.gauge,.trend{width:100%;height:auto;display:block}
.trend text,.gauge text{font-family:var(--mono);fill:var(--muted)}
.fnd{border:1px solid var(--edge2);border-left:3px solid var(--warn);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;background:rgba(63,210,255,.05)}
.fnd.hi{border-left-color:var(--crit)}
.fnd .h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.fnd .id{font-family:var(--sans);font-weight:700;font-size:.78rem;color:var(--cy)}
.fnd p{font-size:.9rem}
.empty{border:1px dashed var(--edge);border-radius:4px;padding:10px;color:var(--muted);font-size:.86rem}

@media (max-width:1099px){.mapcol{order:-1}}
@media (max-width:700px){.legend{font-size:.68rem;padding:6px 8px;gap:3px;left:8px;bottom:8px}.legend .sw{width:12px;height:12px}.layer{left:8px;top:8px}}
/* pita bawah */
.ticker{display:flex;align-items:stretch;border:1px solid var(--edge);border-radius:4px;background:var(--pn);min-height:46px;overflow:hidden}
.ticker .lb{display:flex;align-items:center;gap:8px;padding:0 14px;background:linear-gradient(90deg,rgba(240,80,74,.4),rgba(240,80,74,.1));font-family:var(--disp);font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:.8rem;white-space:nowrap}
.ticker .tr{flex:1;min-width:0;overflow:hidden;position:relative;display:flex;align-items:center}
.ticker .mv{display:flex;gap:44px;white-space:nowrap;animation:mq 90s linear infinite;padding-left:24px}
.ticker:hover .mv,.ticker:focus-within .mv{animation-play-state:paused}
.ticker button{border:0;background:transparent;font-size:.92rem;padding:10px 0;white-space:nowrap}
.ticker button b{color:var(--tc);margin-right:8px;font-family:var(--mono);font-size:.78rem}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .mv{animation:none}.ticker .tr{overflow-x:auto}}

/* lapisan */
.ov{position:fixed;inset:0;z-index:20;background:rgba(2,8,16,.82);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px}
.sheet{width:min(980px,100%);max-height:100%;display:flex;flex-direction:column}
.sheet .bd{padding:14px 16px;gap:12px}
.sheet h3{font-family:var(--disp);letter-spacing:.05em;text-transform:uppercase;font-size:1rem;padding-top:6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted)}
.sheet ul b{color:var(--fg)}
</style>

function sumP(list,m){let DU=0,st=0,bal=0;list.forEach(p=>{const r=p[m];if(r&&r.DU!=null){DU+=r.DU;st+=r.stunting;bal+=r.balita||0}});return{DU,st,bal,v:pct(st,DU)}}
const kecP=k=>P.filter(p=>p.kec===k);
function kecState(k,m){const ps=kecP(k);const v=ps.filter(p=>valid(p,m)).length,e=ps.filter(p=>empty(p,m)).length;if(v===ps.length)return'lengkap';if(e===ps.length)return'kosong';return'sebagian'}
function kecVal(k,m){return{...sumP(kecP(k),m),state:kecState(k,m)}}
const prevM=m=>MONTHS[MONTHS.indexOf(m)-1]||null;
function kabVal(m){const vp=P.filter(p=>valid(p,m));return{...sumP(vp,m),n:vp.length}}

/* ---------- temuan otomatis ---------- */
function findings(m){
  const out=[];const idx=MONTHS.indexOf(m);
  const since=t=>{let n=0;for(let i=idx;i>=0;i--){if(t(MONTHS[i]))n++;else break}return n};
  P.forEach(p=>{
    const nm=title(p.name);const r=p[m];
    const isEmpty=empty(p,m),part=!isEmpty&&!valid(p,m);
    if(isEmpty)out.push({key:'R2:'+p.name,rule:'R2',level:'bupati',opd:'Dinkes',ent:nm,short:`${nm}: laporan ${m} belum masuk`,
      text:`Puskesmas ${nm} belum mengirim data ${m}. Perlu diperiksa apakah laporan tidak terunggah.`,age:since(x=>empty(p,x))});
    else if(part)out.push({key:'R3:'+p.name,rule:'R3',level:'tps',opd:'Dinkes',ent:nm,short:`${nm}: laporan terisi sebagian`,
      text:`Laporan Puskesmas ${nm} bulan ${m} hanya memuat ${fmt(r.balita)} balita, kurang dari separuh jumlah biasanya (${fmt(maxBal(p))}). Perlu diperiksa apakah unggahan terpotong.`,age:since(x=>!valid(p,x))});
    if(isEmpty||part){const a=since(x=>empty(p,x)||!valid(p,x));
      if(a>=2)out.push({key:'R4:'+p.name,rule:'R4',level:'bupati',opd:'Dinkes',ent:nm,short:`${nm}: tidak lengkap ${a} bulan berturut-turut`,
        text:`Puskesmas ${nm} tidak lengkap ${a} bulan berturut-turut (sampai ${m}).`,age:a})}
    if(!r)return;
    if(r.D>r.balita)out.push({key:'R6:'+p.name,rule:'R6',level:'bupati',opd:'Dinkes',ent:nm,short:`${nm}: ditimbang lebih banyak dari terdata`,
      text:`Puskesmas ${nm} mencatat ${fmt(r.D)} balita ditimbang, padahal yang terdata ${fmt(r.balita)}. Angka tidak mungkin; perlu diperiksa.`,age:1});
    if(r.stunting>r.DU||(r.Dp!=null&&r.N+r.T!==r.Dp))out.push({key:'R7:'+p.name,rule:'R7',level:'tps',opd:'Dinkes',ent:nm,short:`${nm}: hitungan antar kolom tidak cocok`,
      text:`Hitungan di Puskesmas ${nm} tidak cocok antar kolom (naik + tidak naik berat badan ≠ ditimbang terkoreksi, atau stunting lebih besar dari yang diukur). Perlu diperiksa.`,age:1});
    if(r.desaTotal&&r.desaInput!=null&&r.desaInput<r.desaTotal)out.push({key:'R5:'+p.name,rule:'R5',level:'tps',opd:'Dinkes',ent:nm,short:`${nm}: ${r.desaTotal-r.desaInput} desa belum input`,
      text:`Di Puskesmas ${nm}, ${r.desaTotal-r.desaInput} dari ${r.desaTotal} desa belum menginput data balita.`,age:1});
    if(valid(p,m)&&rate(r)>=ZONE_CRIT)out.push({key:'R8:'+p.name,rule:'R8',level:'bupati',opd:'Dinkes',ent:nm,short:`${nm}: zona kritis ${fmt(rate(r),1)}%`,
      text:`Puskesmas ${nm} di zona kritis: ${fmt(rate(r),1)}% balita yang diukur stunting.`,age:since(x=>valid(p,x)&&rate(p[x])>=ZONE_CRIT)})
  });
  const G=[['gk','balita gizi kurang'],['bk','balita berat badan kurang'],['t','balita berat badan tidak naik'],['kek','ibu hamil KEK (kurang energi kronis)']];
  G.forEach(([g,lab])=>{let tot=0,got=0,n0=0;
    P.forEach(p=>{const r=p[m];if(!r||!r.mt)return;const[s,d]=r.mt[g];if(s>0){tot+=s;got+=d;if(d===0)n0++}});
    if(n0>0){const big=n0>=P.length/3;
      out.push({key:'R1:'+g,rule:'R1',level:big?'bupati':'tps',opd:'Dinkes',ent:'Makanan tambahan',short:`Makanan tambahan: ${n0} dari ${P.length} Puskesmas belum tercatat memberi ke ${lab}`,
        text:`Di ${n0} dari ${P.length} Puskesmas belum tercatat ${lab} yang menerima makanan tambahan, padahal sasarannya ${fmt(tot)} orang di Kabupaten (tercatat menerima ${fmt(got)}). Perlu diperiksa apakah belum dibagikan atau belum dicatat.`,age:1,g,n0})}});
  return out;
}
const KIND={R1:'tindak',R8:'tindak',R6:'angka',R7:'angka',R2:'data',R3:'data',R4:'data',R5:'data'};
const KL={tindak:['▲','Perlu tindakan',0],angka:['◆','Angka janggal',1],data:['○','Data belum masuk',2]};
const kindOf=f=>KL[KIND[f.rule]];
function diffFindings(m){const pm=prevM(m);if(!pm)return null;const a=new Set(findings(pm).map(f=>f.key)),b=findings(m).map(f=>f.key);const bs=new Set(b);
  return{baru:b.filter(k=>!a.has(k)).length,selesai:[...a].filter(k=>!bs.has(k)).length}}

/* ---------- ringkasan deskriptif ---------- */
function summaryHTML(m){
  const vp=P.filter(p=>valid(p,m));const s=sumP(vp,m);const pm=prevM(m);
  const F=findings(m);const bup=F.filter(f=>f.level==='bupati');const lines=[];
  let l1=`<b>${m} 2026.</b> Dari ${fmt(s.DU)} balita yang diukur di ${vp.length} Puskesmas dengan laporan lengkap, <b>${fmt(s.v,1)}%</b> stunting`;
  if(pm){const both=P.filter(p=>valid(p,m)&&valid(p,pm));const d=sumP(both,m).v-sumP(both,pm).v;
    l1+=Math.abs(d)<0.05?', hampir sama dengan bulan lalu':`, ${d<0?'turun':'naik'} ${fmt(Math.abs(d),1)} poin dari bulan lalu`}
  const gap=s.st-TARGET/100*s.DU;
  l1+='.'+(gap>0?` Masih ada jarak sekitar ${fmt(Math.round(gap/10)*10)} anak ke angka ${TARGET}%.`:` Angka sudah di bawah ${TARGET}%.`);
  lines.push(l1);
  const kr=P.filter(p=>valid(p,m)&&rate(p[m])>=ZONE_CRIT).map(p=>title(p.name));
  const wr=P.filter(p=>valid(p,m)&&rate(p[m])>=ZONE_WARN&&rate(p[m])<ZONE_CRIT).length;
  lines.push(`<b>Sebaran.</b> ${kr.length} Puskesmas di zona kritis${kr.length?' ('+kr.slice(0,4).join(', ')+(kr.length>4?', dan lainnya':'')+')':''}, ${wr} di zona waspada.`);
  const urg=[];const r1=bup.filter(f=>f.rule==='R1');
  if(r1.length)urg.push(`makanan tambahan belum tercatat sampai sasaran di ${Math.max(...r1.map(f=>f.n0))} dari ${P.length} Puskesmas (tanggung jawab Dinkes)`);
  const lp=[...new Set(bup.filter(f=>f.rule==='R2'||f.rule==='R4').map(f=>f.ent))];const prt=F.filter(f=>f.rule==='R3').map(f=>f.ent);
  if(lp.length)urg.push(`laporan ${lp.slice(0,3).join(', ')}${lp.length>3?' dan lainnya':''} kosong atau tidak lengkap berulang`);
  if(prt.length)urg.push(`laporan ${prt.slice(0,3).join(', ')}${prt.length>3?' dan lainnya':''} terisi sebagian`);
  if(bup.some(f=>f.rule==='R6'))urg.push('ada Puskesmas yang mencatat balita ditimbang lebih banyak dari yang terdata');
  lines.push(urg.length?`<b>Perlu perhatian segera.</b> ${urg.join('; ')}.`:'<b>Perlu perhatian segera.</b> Tidak ada temuan tingkat tinggi bulan ini.');
  const df=diffFindings(m);
  lines.push(df?`<b>Dibanding bulan lalu.</b> ${df.baru} temuan baru, ${df.selesai} temuan selesai.`:'<b>Dibanding bulan lalu.</b> Belum ada pembanding; Juni adalah bulan pertama data.');
  return lines.map(x=>`<p>${x}</p>`).join('');
}

let vb={x:0,y:0,w:1000,h:760};const FULL={x:-10,y:-10,w:1020,h:DATA.H+20};

let anim=null;

  if(matchMedia('(prefers-reduced-motion:reduce)').matches){setVB(t);drawLabels();return}
  const s={...vb},t0=performance.now(),D=450;const step=now=>{const u=Math.min(1,(now-t0)/D),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    setVB({x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e,w:s.w+(t.w-s.w)*e,h:s.h+(t.h-s.h)*e});if(u<1)anim=requestAnimationFrame(step);else drawLabels()};anim=requestAnimationFrame(step)}
function boxOf(k,pad=40){const b=kobj[k].bb;let w=b[2]-b[0]+pad*2,h=b[3]-b[1]+pad*2;
  const cw=svg.clientWidth||1,ch=svg.clientHeight||1,r=cw/ch;if(w/h<r)w=h*r;else h=w/r;const cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;return{x:cx-w/2,y:cy-h/2,w,h}}
function fullBox(){const cw=svg.clientWidth||1,ch=svg.clientHeight||1,r=cw/ch;let w=FULL.w,h=FULL.h;if(w/h<r)w=h*r;else h=w/r;return{x:FULL.x+FULL.w/2-w/2,y:FULL.y+FULL.h/2-h/2,w,h}}
function kecColor(k,m){const kv=kecVal(k,m);
  if(cur.layer==='laporan')return{c:kv.state==='lengkap'?'var(--good)':kv.state==='sebagian'?'#c9a23a':'var(--crit)',hatch:false,kv};
  if(kv.state!=='lengkap')return{c:'var(--none)',hatch:true,kv};
  return{c:ZC[zoneOf(kv.v)],hatch:false,kv}}
function desaColor(d,m){const kc=kecColor(d.k,m);
  if(cur.layer==='laporan'||m!=='Juni'||!d.e)return{c:kc.c,mode:'borrow',kc};
  if(!d.e.diukur)return{c:'var(--none)',mode:'borrow',kc};
  const v=pct(d.e.stunting,d.e.diukur);return{c:ZC[zoneOf(v)],mode:d.e.diukur<SMALLN?'small':'own',v,kc}}
function drawMap(){
  gKec.textContent='';gDesa.textContent='';const m=cur.month;
  KEC.forEach(K=>{const kc=kecColor(K.name,m);
    const g=sv('g',{class:'kg',tabindex:'0',role:'button','aria-label':`Kecamatan ${K.name}`});
    g.style.opacity=cur.kec&&cur.kec!==K.name?.34:1;const ds=desaByK[K.name];
    const p1=sv('g',{fill:'none',stroke:'#09192d','stroke-width':5,'stroke-linejoin':'round'});

    ds.forEach(d=>{p1.appendChild(sv('path',{d:d.d,'vector-effect':'non-scaling-stroke'}));p2.appendChild(sv('path',{d:d.d,'vector-effect':'non-scaling-stroke'}))});

      g.appendChild(sv('path',{d:d.d,fill:dc.c,stroke:sel?'#fff':'#09192d','stroke-width':sel?3:1.4,'stroke-linejoin':'round','vector-effect':'non-scaling-stroke'}));

const pnl=(t,b,sub,cls='')=>`<section class="pn ${cls}"><header><i></i>${t}${sub?`<span class="sub">${sub}</span>`:''}</header><div class="bd">${b}</div></section>`;

function gauge(v,label){const cx=120,cy=118,r=92;let s=`<svg class="gauge" viewBox="0 0 240 150" role="img" aria-label="Pengukur stunting ${v==null?'tidak ada data':fmt(v,1)+' persen'}">`;

    const [mx,my]=arcPt(cx,cy,r,vv);s+=`<circle cx="${mx}" cy="${my}" r="9" fill="#fff" stroke="${ZC[z]}" stroke-width="3"/>`}
  const [t0x,t0y]=arcPt(cx,cy,r-12,TARGET),[t1x,t1y]=arcPt(cx,cy,r+13,TARGET),[tx,ty]=arcPt(cx,cy,r+26,TARGET);

  [0,20,30,40].forEach(t=>{const [x,y]=arcPt(cx,cy,r+(t===0||t===40?0:0),t);});
  s+=`<text x="${cx-r}" y="${cy+30}" text-anchor="middle" font-size="9">0</text><text x="${cx+r}" y="${cy+30}" text-anchor="middle" font-size="9">40</text>`;
  return s+'</svg>'}
function trend(vals,counts,valid_){const W=330,H=150,pl=30,pr=16,pt=18,pb=36;const xs=i=>pl+i*(W-pl-pr)/2;
  const ok=vals.filter(v=>v!=null);const lo=Math.min(10,...ok)-2,hi=Math.max(ZONE_CRIT+2,...ok)+2;const ys=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let s=`<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tren stunting Juni sampai Agustus">`;

  [ZONE_WARN,ZONE_CRIT].forEach(z=>s+=`<line x1="${pl}" x2="${W-pr}" y1="${ys(z)}" y2="${ys(z)}" stroke="rgba(143,177,201,.4)" stroke-dasharray="3 3"/><text x="${pl-4}" y="${ys(z)+4}" text-anchor="end" font-size="10">${z}</text>`);
  const pts=vals.map((v,i)=>v==null?null:[xs(i),ys(v)]);

/* ---------- kesenjangan layanan: sasaran vs penerima makanan tambahan ---------- */
const LAYG=[['gk','Gizi kurang','balita gizi kurang'],['bk','BB kurang','balita berat badan kurang'],['t','BB tidak naik','balita berat badan tidak naik'],['kek','Ibu hamil KEK','ibu hamil kurang energi kronis']];
const lay={g:'gk',s:'n'};
function layRows(m,g){return P.filter(p=>valid(p,m)&&p[m].mt&&p[m].mt[g][0]>0).map(p=>{const [s,d]=p[m].mt[g];return{p,s,d,gap:Math.max(0,s-d),cov:d/s*100}})}
function layHTML(){const m=cur.month,g=lay.g,G=LAYG.find(x=>x[0]===g);
  const R=layRows(m,g),S=R.reduce((a,r)=>a+r.s,0),D=R.reduce((a,r)=>a+r.d,0),skip=P.filter(p=>valid(p,m)).length-R.length;
  const zeroAll=S>0&&D===0;
  R.sort(lay.s==='n'?(a,b)=>b.gap-a.gap:(a,b)=>a.cov-b.cov||b.gap-a.gap);
  const seg=(items,key)=>`<div class="seg" role="group">${items.map(([k,n])=>`<button data-${key}="${k}" aria-pressed="${lay[key]===k}">${n}</button>`).join('')}</div>`;
  return`<p class="sm">Makanan tambahan (PMT) menurut tarikan Sigizi. Sasaran = jumlah yang memenuhi syarat menerima; Tercatat = jumlah yang sudah tercatat menerima. Ini angka <b>pencatatan</b>: nol belum tentu berarti tidak dibagikan, bisa juga belum dicatat. Kelompok di tarikan ini adalah gizi kurang, BB kurang, BB tidak naik, dan ibu hamil KEK, bukan daftar anak stunting.</p>
  <div style="display:flex;flex-wrap:wrap;gap:8px">${seg(LAYG.map(x=>[x[0],x[1]]),'g')}${seg([['n','Anak belum terlayani terbanyak'],['c','Cakupan terendah']],'s')}</div>
  <div class="stats"><div class="stat"><div class="v">${fmt(S)}</div><div class="l">sasaran: ${G[2]}</div></div><div class="stat"><div class="v">${fmt(D)}</div><div class="l">tercatat menerima</div></div><div class="stat"><div class="v">${fmt(Math.max(0,S-D))}</div><div class="l">selisih (belum tercatat)</div></div></div>
  ${zeroAll?`<div class="fnd hi"><div class="h"><span class="tag t-warn">◆ Periksa dulu</span></div><p>Bulan ${m}: tidak ada satu pun Puskesmas yang mencatat penerima pada kelompok ${G[1].toLowerCase()}. Ini lebih mirip data belum diisi daripada tidak ada PMT. Konfirmasi ke Dinkes sebelum membaca angka ini sebagai kekurangan.</p></div>`:''}
  <div>${R.map(r=>`<div class="rk" style="cursor:default;grid-template-columns:minmax(0,1fr) auto"><span class="nm">${esc(title(r.p.name))}<span class="sm"> · ${esc(r.p.kec)}</span></span><span class="pc" style="white-space:nowrap">${fmt(r.d)}/${fmt(r.s)}</span><span class="bar"><i style="width:${Math.min(100,r.cov)}%;background:${r.cov<25?'var(--crit)':r.cov<75?'var(--warn)':'var(--good)'}"></i></span></div>`).join('')||'<div class="empty">Tidak ada Puskesmas dengan sasaran pada kelompok ini.</div>'}</div>
  <p class="sm">${R.length} Puskesmas punya sasaran. ${skip>0?skip+' Puskesmas lain berlaporan lengkap tetapi sasarannya 0 atau kosong. ':''}Hanya laporan lengkap yang dihitung. Batas warna cakupan (&lt;25% merah, 25–75% kuning) adalah usulan, belum disepakati dengan Dinkes. Apakah ibu hamil KEK bersifat kumulatif atau bulanan juga masih menunggu konfirmasi.</p>`}

function openKrs(){openOv('Faktor risiko keluarga · KRS '+KRS.tahun,'<div id="krBd" style="display:flex;flex-direction:column;gap:12px"></div>');drawKrs()}
function drawKrs(){const b=$('krBd');b.innerHTML=krsHTML();b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{kr.i=x.dataset.i;drawKrs()});b.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{kr.k=x.dataset.k;drawKrs()});const bk=$('krBack');if(bk)bk.onclick=()=>{kr.k=null;drawKrs()}}
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour12:false}).replace(/\./g,':')+' WIB';
  $('date').textContent=d.toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function renderAll(){drawMap();renderLegend();renderCrumb();renderCols();renderTicker()}
const sm=$('segMonth');
MONTHS.forEach(m=>{const b=el('button',{'aria-pressed':m===cur.month},m);b.onclick=()=>{cur.month=m;sm.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderAll()};sm.appendChild(b)});
document.querySelectorAll('#segLayer button').forEach(b=>b.onclick=()=>{cur.layer=b.dataset.l;document.querySelectorAll('#segLayer button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderAll()});
$('btnTemuan').onclick=()=>openTemuan(null);$('btnLay').onclick=openLayanan;$('btnKrs').onclick=openKrs;$('btnAbout').onclick=openAbout;$('ovX').onclick=closeOv;
ov.addEventListener('click',e=>{if(e.target===ov)closeOv()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});
svg.addEventListener('click',e=>{if(e.target===svg&&cur.kec)backAll()});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{setVB(cur.kec?boxOf(cur.kec):fullBox());drawLabels()},120)});
tick();setInterval(tick,1000);
requestAnimationFrame(()=>{setVB(fullBox());renderAll()});
</script>

</body>
</html>
